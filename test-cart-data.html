<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cart Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .success {
            background: #d4edda;
            border-color: #c3e6cb;
        }
        .error {
            background: #f8d7da;
            border-color: #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>Test Cart & Offers/Coupons</h1>

    <div class="section">
        <h2>1. Check Cart Data</h2>
        <button onclick="checkCart()">Check localStorage Cart</button>
        <pre id="cartData"></pre>
    </div>

    <div class="section">
        <h2>2. Test Active Offers</h2>
        <button onclick="testOffers()">Test Active Offers</button>
        <pre id="offersResult"></pre>
    </div>

    <div class="section">
        <h2>3. Test Coupon Validation</h2>
        <input type="text" id="couponCode" placeholder="Enter coupon code" style="padding: 8px; width: 200px;">
        <button onclick="testCoupon()">Validate Coupon</button>
        <pre id="couponResult"></pre>
    </div>

    <div class="section">
        <h2>4. Debug Info</h2>
        <button onclick="showDebugInfo()">Show Current Date/Time Info</button>
        <pre id="debugInfo"></pre>
    </div>

    <script>
        function checkCart() {
            const cart = localStorage.getItem('ecommerce_cart');
            const cartData = document.getElementById('cartData');

            if (cart) {
                try {
                    const parsed = JSON.parse(cart);
                    cartData.textContent = JSON.stringify(parsed, null, 2);
                    cartData.className = 'success';
                } catch (e) {
                    cartData.textContent = 'Error parsing cart: ' + e.message;
                    cartData.className = 'error';
                }
            } else {
                cartData.textContent = 'No cart found in localStorage';
                cartData.className = 'error';
            }
        }

        async function testOffers() {
            const resultDiv = document.getElementById('offersResult');
            resultDiv.textContent = 'Loading...';

            const cart = localStorage.getItem('ecommerce_cart');
            if (!cart) {
                resultDiv.textContent = 'No cart found. Add items to cart first.';
                resultDiv.className = 'error';
                return;
            }

            const cartData = JSON.parse(cart);
            const payload = {
                cart: {
                    items: cartData.map(item => ({
                        product_id: item.product_id,
                        price: item.price,
                        quantity: item.quantity,
                        category_id: item.category_id,
                        subcategory_id: item.subcategory_id
                    }))
                }
            };

            console.log('Sending payload:', payload);

            try {
                const response = await fetch('http://localhost:3000/api/v1/ecommerce/cart/active-offers', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                resultDiv.textContent = JSON.stringify(data, null, 2);
                resultDiv.className = response.ok ? 'success' : 'error';
            } catch (error) {
                resultDiv.textContent = 'Error: ' + error.message;
                resultDiv.className = 'error';
            }
        }

        async function testCoupon() {
            const code = document.getElementById('couponCode').value;
            const resultDiv = document.getElementById('couponResult');

            if (!code) {
                resultDiv.textContent = 'Please enter a coupon code';
                resultDiv.className = 'error';
                return;
            }

            resultDiv.textContent = 'Loading...';

            const cart = localStorage.getItem('ecommerce_cart');
            if (!cart) {
                resultDiv.textContent = 'No cart found. Add items to cart first.';
                resultDiv.className = 'error';
                return;
            }

            const cartData = JSON.parse(cart);
            const payload = {
                code: code.trim().toUpperCase(),
                cart: {
                    items: cartData.map(item => ({
                        product_id: item.product_id,
                        price: item.price,
                        quantity: item.quantity,
                        category_id: item.category_id,
                        subcategory_id: item.subcategory_id
                    }))
                }
            };

            console.log('Sending payload:', payload);

            try {
                const response = await fetch('http://localhost:3000/api/v1/ecommerce/cart/validate-coupon', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                resultDiv.textContent = JSON.stringify(data, null, 2);
                resultDiv.className = response.ok ? 'success' : 'error';
            } catch (error) {
                resultDiv.textContent = 'Error: ' + error.message;
                resultDiv.className = 'error';
            }
        }

        function showDebugInfo() {
            const now = new Date();
            const dayOfWeek = now.getDay();
            const dayNames = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];

            const info = {
                currentDate: now.toISOString().split('T')[0],
                currentTime: now.toTimeString().split(' ')[0],
                dayOfWeek: dayNames[dayOfWeek],
                dayField: `aplica_${dayNames[dayOfWeek]}`,
                fullDate: now.toString()
            };

            document.getElementById('debugInfo').textContent = JSON.stringify(info, null, 2);
            document.getElementById('debugInfo').className = 'success';
        }

        // Auto-check cart on load
        window.onload = () => {
            checkCart();
            showDebugInfo();
        };
    </script>
</body>
</html>
